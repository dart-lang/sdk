# Test that cycle in libraries doesn't crash.

type: newworld
worlds:
  - entry: a.dart
    sources:
      a.dart: |
        import "b.dart";
        void main() {
          fromB();
        }
        void fromA() {}
      b.dart: |
        import "c.dart";
        void fromB() {
          return fromC();
        }
      c.dart: |
        import "a.dart";
        void fromC() {
          return fromA();
        }
    expectedLibraryCount: 3

  - entry: a.dart
    worldType: updated
    expectInitializeFromDill: false
    invalidate:
      - a.dart
    sources:
      a.dart: |
        import "b.dart";
        void main() {
          fromB();
          print("done");
        }
        void fromA() {}
    expectedLibraryCount: 3
    advancedInvalidation: bodiesOnly
