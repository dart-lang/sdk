# Load from a dill file, update a file in the dill that is the context of an
# error in such a way that the position in the old library doesn't exist in
# newly compiled procedure.
#
# A version using packages.

type: newworld
worlds:
  - entry: x/main.dart
    sources:
      .dart_tool/package_config.json: |
        {
          "configVersion": 2,
          "packages": [
            {
              "name": "x",
              "rootUri": "../x"
            }
          ]
        }
      x/main.dart: |
        import "b.dart";
        main() {
          b(42);
        }
      x/b.dart: |
        // lots of comments
        // forcing offsets down
        // adding more lines
        // to be removed in the next world
        b({int? named}) {
          print("b");
        }
    expectedLibraryCount: 2
    errors: true

  - entry: x/main.dart
    invalidate:
      - x/b.dart
    sources:
      x/main.dart: |
        import "b.dart";
        main() {
          b(42);
        }
      x/b.dart: |
        b({int? named}) {
          print("b");
        }
      .dart_tool/package_config.json: |
        {
          "configVersion": 2,
          "packages": [
            {
              "name": "x",
              "rootUri": "../x"
            }
          ]
        }
    expectedLibraryCount: 2
    errors: true
    advancedInvalidation: problemsInRelatedLibrary
