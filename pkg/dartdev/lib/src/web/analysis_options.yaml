include: package:dart_flutter_team_lints/analysis_options.yaml

# TODO(https://github.com/dart-lang/sdk/issues/64975): Remove this file once
# all of pkg/dartdev uses the same lints.
analyzer:
  language:
    # From pkg/dartdev/analysis_options.yaml, which this file replaces.
    strict-raw-types: true

linter:
  rules:
    always_use_package_imports: true
    prefer_relative_imports: false
